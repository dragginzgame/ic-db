[package]
name = "ic-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
description = "Experimental embedded Internet Computer database"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
build = ["dep:ctor"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctor = { workspace = true, optional = true }

[dependencies]
ethnum.workspace = true
ic-db-macros.workspace = true
ic-platform-types.workspace = true
ic-storage.workspace = true
memchr.workspace = true
sha2.workspace = true
ulid.workspace = true

[lints]
workspace = true
