[package]
name = "ic-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
description = "Experimental embedded Internet Computer database"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
build = ["dep:ctor"]
test-support = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctor = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-protocol = { workspace = true, features = ["raw-rand"] }
ic-platform-runtime = { workspace = true, features = ["call-ic0"] }

[dependencies]
ethnum.workspace = true
ic-db-macros.workspace = true
ic-platform-types.workspace = true
ic-storage.workspace = true
memchr.workspace = true
sha2.workspace = true
ulid.workspace = true

[dev-dependencies]
ic-db = { path = ".", features = ["test-support"] }
toko-tooling.workspace = true

[lints]
workspace = true
