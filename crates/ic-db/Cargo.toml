[package]
name = "ic-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
description = "Experimental embedded Internet Computer database"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
build = ["dep:ctor"]
test-support = []
wire = ["dep:ic-wire"]
logging = ["dep:ic-logging"]
metrics = ["dep:ic-metrics"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ctor = { workspace = true, optional = true }
getrandom.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["raw-rand"] }

[dependencies]
ethnum.workspace = true
ic-db-macros.workspace = true
ic-logging = { workspace = true, optional = true }
ic-metrics = { workspace = true, optional = true }
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-wire = { workspace = true, optional = true, features = ["derive", "platform-types", "typescript"] }
memchr.workspace = true
serde.workspace = true
sha2.workspace = true
ulid.workspace = true

[dev-dependencies]
ic-db = { path = ".", features = ["test-support"] }
serde_json.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true
