[package]
name = "ic-db-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Local fixture console for IC DB"
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[[bin]]
name = "db"
path = "src/main.rs"
required-features = ["console"]

[features]
default = ["console"]
console = [
    "host",
    "dep:clap",
    "dep:ic-host-text",
    "dep:rustyline",
    "dep:serde_json",
    "dep:shlex",
    "tokio/rt-multi-thread",
]
host = ["dep:ic-testkit", "dep:ic-wire", "dep:tokio"]

[dependencies]
clap = { workspace = true, optional = true }
ic-host-text = { workspace = true, optional = true }
ic-testkit = { workspace = true, optional = true }
ic-wire = { workspace = true, optional = true }
rustyline = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
shlex = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
