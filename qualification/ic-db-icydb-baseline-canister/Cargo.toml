[package]
name = "ic-db-icydb-baseline-canister"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib"]

[features]
envelope = ["ic-db-icydb-baseline-schema/envelope"]
aggregate-comparison = []
count-comparison = []
fluent-comparison = []
query-matrix = ["fluent-comparison", "aggregate-comparison", "count-comparison"]

[dependencies]
ic-db-icydb-baseline-schema.workspace = true
ic-db-qualification-transport.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
icydb.workspace = true

[build-dependencies]
ic-db-icydb-baseline-schema = { workspace = true, features = ["build"] }
icydb = { workspace = true, features = ["build"] }

[lints]
workspace = true
