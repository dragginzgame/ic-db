[package]
name = "ic-db-m1-records-canister"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib"]

[features]
aggregate-jobs = ["fault-injection"]
retained-console = []
query-measurements = []
fault-injection = []
maintenance = []
maintenance-v2 = ["maintenance"]
maintenance-faults = ["maintenance", "fault-injection"]
mixed-lifecycle = ["dep:canic"]

[dependencies]
canic = { workspace = true, optional = true }
ic-db = { workspace = true, features = ["test-support"] }
ic-db-qualification-transport.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-storage.workspace = true
records-schema.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
