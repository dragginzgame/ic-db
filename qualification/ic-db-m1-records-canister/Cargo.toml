[package]
name = "ic-db-m1-records-canister"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib"]

[features]
aggregate-jobs = ["fault-injection"]
retained-console = []
query-measurements = []
fault-injection = ["ic-db/test-support"]
maintenance = []
maintenance-v2 = ["maintenance"]
maintenance-faults = ["maintenance", "fault-injection"]
mixed-lifecycle = ["dep:canic"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic = { workspace = true, optional = true }

[dependencies]
ic-db.workspace = true
ic-db-m1-records-schema.workspace = true
ic-db-qualification-transport.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-storage.workspace = true
ic-wire.workspace = true

[build-dependencies]
ic-db-m1-records-schema = { workspace = true, features = ["build"] }

[lints]
workspace = true
