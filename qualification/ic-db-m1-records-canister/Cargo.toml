[package]
name = "ic-db-m1-records-canister"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib"]

[features]
aggregate-jobs = ["fault-injection"]
retained-console = []
fault-injection = []
maintenance = []
maintenance-v2 = ["maintenance"]
maintenance-faults = ["maintenance", "fault-injection"]

[dependencies]
ic-db.workspace = true
ic-db-m1-records-schema.workspace = true
ic-db-qualification-transport.workspace = true
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-storage.workspace = true
ic-wire.workspace = true

[build-dependencies]
ic-db-m1-records-schema = { workspace = true, features = ["build"] }

[lints]
workspace = true
