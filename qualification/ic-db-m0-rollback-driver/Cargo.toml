[package]
name = "ic-db-m0-rollback-driver"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[dependencies]
clap.workspace = true
ic-host-text.workspace = true
ic-wire.workspace = true
pocket-ic.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
ic-host-artifacts.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
wasmparser.workspace = true

[[test]]
name = "rollback"
path = "tests/rollback.rs"

[lints]
workspace = true
