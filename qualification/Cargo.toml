[workspace]
members = [
    "aggregation-canister",
    "icydb-baseline-canister",
    "icydb-baseline-schema",
    "maintenance-canister",
    "records-canister",
    "rollback-canister",
    "rollback-driver",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ic-db = { path = "../crates/ic-db" }
ic-db-icydb-baseline-schema = { path = "icydb-baseline-schema" }
ic-host-artifacts = "0.77.2"
ic-host-text = "0.75.0"
ic-platform-runtime = { version = "0.22.3", default-features = false }
ic-storage = "0.74.1"
ic-testkit = "0.104.0"
ic-wire = "0.22.1"
ic-wire-endpoint = "0.13.1"
icydb = { git = "https://github.com/dragginzgame/icydb", rev = "6d421e3601a3d71e42af23ea5fe6b168cb6ef2ac", default-features = false }
serde = "1.0.229"
sha2 = { version = "0.11.1", default-features = false }
tokio = "1.54.1"
toko-tooling = "=0.43.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
# Frozen IcyDB's native schema registration explicitly allows generated ctor
# internals. Ordinary probe crates additionally forbid unsafe code at crate root.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
