[workspace]
members = [
    "experiments/schema-owner/consumer",
    "experiments/schema-owner/local",
    "experiments/schema-owner/producer",
    "ic-db-entity-growth-canister",
    "ic-db-icydb-baseline-canister",
    "ic-db-icydb-baseline-schema",
    "ic-db-m0-aggregation-canister",
    "ic-db-m0-maintenance-canister",
    "ic-db-m0-rollback-canister",
    "ic-db-m0-rollback-driver",
    "ic-db-m1-records-canister",
    "ic-db-m1-records-schema",
    "ic-db-qualification-transport",
    "ic-db-records-benchmark-canister",
    "ic-db-sqlite-reference",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"
publish = false

[workspace.dependencies]
accounts = { package = "ic-db-schema-owner-producer", path = "experiments/schema-owner/producer" }
canic = { version = "0.242.0", default-features = false, features = ["db"] }
clap = { version = "4.6.7", features = ["derive"] }
ic-db = { path = "../crates/ic-db" }
ic-db-icydb-baseline-schema = { path = "ic-db-icydb-baseline-schema" }
ic-db-qualification-transport = { path = "ic-db-qualification-transport" }
ic-host-artifacts = "0.80.6"
ic-host-text = "0.77.4"
ic-platform-runtime = { version = "0.23.22", default-features = false }
ic-storage = "0.78.7"
ic-testkit = { version = "0.110.3", default-features = false }
ic-wire = "0.27.0"
icydb = { git = "https://github.com/dragginzgame/icydb-legacy", rev = "6d421e3601a3d71e42af23ea5fe6b168cb6ef2ac", default-features = false }
records-schema = { package = "ic-db-m1-records-schema", path = "ic-db-m1-records-schema" }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
rustyline = { version = "19.0.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
shlex = "2.0.1"
tokio = "1.54.1"
toko-tooling = "=0.45.25"
wasmparser = { version = "0.263.0", default-features = false, features = ["std", "features", "validate"] }

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
# Frozen IcyDB's native schema registration explicitly allows generated ctor
# internals. Ordinary probe crates additionally forbid unsafe code at crate root.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
