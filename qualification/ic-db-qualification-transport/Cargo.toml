[package]
name = "ic-db-qualification-transport"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }

[dependencies]
ic-wire.workspace = true
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
