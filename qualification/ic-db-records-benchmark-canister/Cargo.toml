[package]
name = "ic-db-records-benchmark-canister"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib"]

[features]
aggregate-comparison = []
count-comparison = []
exists-comparison = []
count-profile = ["count-comparison"]
fluent-comparison = []
query-matrix = ["fluent-comparison", "aggregate-comparison", "count-comparison"]

[dependencies]
ic-db.workspace = true
ic-db-qualification-transport.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-storage.workspace = true

[lints]
workspace = true
