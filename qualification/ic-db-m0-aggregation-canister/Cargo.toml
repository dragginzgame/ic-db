[package]
name = "ic-db-m0-aggregation-canister"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib"]

[features]
flat-index-control = []
member-index-control = []
optional-member-index-control = ["member-index-control"]

[dependencies]
ic-db-qualification-transport.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-storage.workspace = true

[dev-dependencies]
ic-db.workspace = true
toko-tooling.workspace = true

[[example]]
name = "float64_sum"
crate-type = ["cdylib"]

[[example]]
name = "nested_paths"
crate-type = ["cdylib"]

[lints]
workspace = true
