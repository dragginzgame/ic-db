[workspace]
exclude = ["qualification"]
members = ["crates/ic-db", "crates/ic-db-cli", "crates/ic-db-macros"]
default-members = ["crates/ic-db", "crates/ic-db-macros"]
resolver = "3"

[workspace.package]
version = "0.29.0"
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-db"
publish = ["crates-io"]

[workspace.dependencies]
# Production
ctor = { version = "1.0.14", default-features = false, features = ["std"] }
ethnum = { version = "1.5.3", default-features = false, features = ["serde"] }
getrandom = "0.4.3"
ic-db-macros = { version = "=0.29.0", path = "crates/ic-db-macros" }
ic-logging = { version = "0.25.19", default-features = false }
ic-metrics = { version = "0.30.20", default-features = false }
ic-platform-runtime = { version = "0.23.22", default-features = false }
ic-platform-types = { version = "0.21.4", default-features = false }
ic-storage = "0.78.7"
ic-wire = { version = "0.29.0", default-features = false }
memchr = { version = "2.8.3", default-features = false }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.1", default-features = false }
syn = "3.0.10"
# IC DB owns generation policy; ulid's std feature enables native rand.
ulid = { version = "3.0.0", default-features = false }

# Local console
clap = { version = "4.6.7", features = ["derive"] }
ic-host-text = "0.77.4"
ic-testkit = { version = "0.110.3", default-features = false }
rustyline = { version = "19.0.0", default-features = false }
serde_json = "1.0.154"
shlex = "2.0.1"
tokio = "1.54.1"

# Tests and tooling
ic-db = { path = "crates/ic-db" }
toko-tooling = "=0.46.3"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
# Host schema declarations allow only ctor's generated registration internals.
# Product runtime and macro implementation retain forbid at their crate roots.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"
